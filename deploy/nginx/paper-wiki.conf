# Paper-Wiki nginx 站点配置模板
# 安装：cp 到 /etc/nginx/sites-available/paper-wiki，软链到 sites-enabled，
# 把 server_name 和 root 换成实际值，然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name your-domain-or-ip;

    # web/frontend 执行 npm run build 后生成的静态目录
    root /opt/paper-wiki/web/frontend/dist;
    index index.html;

    # 前端是单页应用，未命中静态文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API，反代到本机 127.0.0.1:8000 上的 uvicorn（systemd 管理）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
